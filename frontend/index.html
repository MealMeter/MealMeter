<!doctype html>
<!-- 역할: 메인 페이지 (/) — 오늘의 메뉴 (명세서 3장 기능 1). 담당: 김태건
     조식·중식·석식 탭, 칼로리·영양소, 메뉴마다 알레르기와 바로 별점 남기기, 오늘 인기 TOP 3.
     화면 틀만 여기 있고, 내용은 js/pages/main.js가 서버(메뉴·평가)와 나이스(칼로리·알레르기) 데이터로 채운다. -->
<!-- [문법] <!doctype html>(맨 첫 줄): 이 문서가 HTML5라는 선언. '<!' + 대시 두 개로 시작하고 대시 두 개 + '>'로 끝나는 부분은 화면에 안 보이는 HTML 주석 -->
<!-- [문법] <html lang="ko">: 문서 전체를 감싸는 뿌리 요소. lang="ko"는 한국어 문서(낭독기 발음·검색에 쓰임) -->
<html lang="ko">
  <!-- [문법] <head>: 화면에 직접 보이지 않는 문서 정보(인코딩, 제목, CSS 연결)를 담는 곳 -->
  <head>
    <!-- [문법] <meta charset>: 글자를 UTF-8로 읽으라는 뜻(한글 깨짐 방지). 끝의 /> 는 내용 없는 빈 요소 표시(생략 가능) -->
    <meta charset="UTF-8" />
    <!-- [문법] viewport: 휴대폰에서 화면 폭을 기기 폭에 맞추고 처음 확대 배율을 1로 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- [문법] theme-color: 휴대폰 브라우저 주소창 등의 색 -->
    <meta name="theme-color" content="#fff9f4" />
    <meta name="description" content="오늘 급식을 평가하고 더 나은 메뉴를 함께 만들어요." />
    <!-- [문법] <title>: 브라우저 탭에 보이는 제목 -->
    <title>오늘의 메뉴 · MealMeter</title>
    <!-- 글꼴: 제목은 Jua, 본문은 Pretendard -->
    <!-- [문법] rel="preconnect": 글꼴 서버에 미리 연결해 두어 더 빨리 받는다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- [문법] rel="stylesheet": 외부 CSS를 불러온다. 구글 폰트 Jua(제목용). display=swap: 받기 전엔 기본 글꼴로 먼저 보여 줌 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <!-- [문법] 본문 글꼴 Pretendard를 CDN에서 버전을 고정(@v1.3.9)해 불러온다 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 스타일: 공통(base.css) + 이 페이지 전용(main.css) -->
    <!-- [문법] "/"로 시작하는 절대 경로: 개발 서버(npm run dev)의 frontend 폴더 기준. 파일을 더블클릭해 열면 못 찾는다 -->
    <link rel="stylesheet" href="/css/base.css" />
    <!-- [문법] 이 페이지 전용 CSS. 공통 CSS 뒤에 불러와서 같은 규칙이면 이쪽이 이긴다 -->
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <!-- [문법] <body>: 화면에 실제로 보이는 내용 -->
  <body>
    <!-- 헤더는 layout.js가 이 위에 넣어 준다 -->
    <!-- [문법] <main>: 페이지 핵심 내용(한 페이지에 하나). id="main": 헤더의 '본문 바로가기' 링크가 찾아오는 이름표 -->
    <!-- [문법] tabindex="-1": Tab 순서엔 안 들어가지만 링크로 이동했을 때 포커스는 받을 수 있게 -->
    <main id="main" class="site-main" tabindex="-1">
      <!-- [문법] <div>: 의미 없는 묶음 상자. class: CSS가 모양을 입힐 때 쓰는 이름 -->
      <div class="today">
        <!-- [문법] <header>: 이 부분의 머리 영역 의미 태그 -->
        <header class="today__head">
          <!-- [문법] <h1>: 페이지의 가장 큰 제목 -->
          <h1>오늘의 메뉴</h1>
          <!-- 날짜 (main.js가 채운다) -->
          <!-- [문법] <p>: 문단. 지금은 비어 있고 JS가 id로 찾아 채운다 -->
          <p class="today__date" id="today-date"></p>
        </header>

        <!-- 식사 탭. 화살표 키로 옮겨 다닐 수 있다. 칼로리·없음 표시는 main.js가 채운다 -->
        <!-- [문법] role="tablist"/"tab"/"tabpanel": 탭 UI라고 낭독기에 알려 주는 ARIA 역할 -->
        <!-- [문법] aria-label: 눈에 안 보이는 이름. aria-controls: 이 탭이 보여 주는 영역의 id. aria-selected: 지금 고른 탭인지 -->
        <div class="meal-tabs" role="tablist" aria-label="식사 선택" id="meal-tabs">
          <!-- [문법] <button type="button">: 폼을 제출하지 않는 일반 버튼. data-meal="1": JS가 dataset.meal로 읽는 사용자 정의 속성 -->
          <!-- [문법] tabindex="-1": 고르지 않은 탭은 Tab 키로 안 들어오고 화살표 키로 옮겨 다닌다 -->
          <button type="button" class="meal-tabs__tab" role="tab" id="meal-tab-1" data-meal="1" aria-controls="meal-panel" aria-selected="false" tabindex="-1">
            <!-- [문법] <span>: 글자 일부를 감싸는 인라인 상자(줄을 바꾸지 않음) -->
            <span class="meal-tabs__label">조식</span><span class="meal-tabs__sub">…</span>
          </button>
          <button type="button" class="meal-tabs__tab" role="tab" id="meal-tab-2" data-meal="2" aria-controls="meal-panel" aria-selected="true">
            <span class="meal-tabs__label">중식</span><span class="meal-tabs__sub">…</span>
          </button>
          <button type="button" class="meal-tabs__tab" role="tab" id="meal-tab-3" data-meal="3" aria-controls="meal-panel" aria-selected="false" tabindex="-1">
            <span class="meal-tabs__label">석식</span><span class="meal-tabs__sub">…</span>
          </button>
        </div>

        <!-- 고른 식사의 메뉴 목록 (불러오는 중 / 오류 / 급식 없음도 이 자리에 나온다) -->
        <!-- [문법] <section>: 주제가 있는 구역. aria-labelledby: 이름을 그 id 요소(고른 탭)의 글자로 정한다 -->
        <section class="today__panel" id="meal-panel" role="tabpanel" aria-labelledby="meal-tab-2"></section>

        <!-- 오늘 인기 TOP 3 (내용은 js/pages/todayTop.js가 채운다) -->
        <!-- [문법] class에 이름을 띄어 여러 개 쓰면 클래스 여러 개가 함께 적용된다(card + today-top) -->
        <section class="card today-top" aria-labelledby="today-top-title">
          <div class="today-top__head">
            <!-- [문법] <h2>: 2단계 제목 -->
            <h2 id="today-top-title">오늘 인기 TOP 3</h2>
            <!-- [문법] <a href>: 링크. 누르면 그 주소로 이동 -->
            <a class="today-top__more" href="/ranking.html">전체 순위</a>
          </div>
          <div id="today-top-list"></div>
        </section>
      </div>
    </main>

    <!-- type="module": import/export를 쓸 수 있게 한다. 위에서부터 순서대로 실행된다 -->
    <!-- [문법] <script type="module" src>: JS 파일을 ES 모듈로 불러온다. HTML을 다 읽은 뒤 적힌 순서대로 실행된다 -->
    <script type="module" src="/js/common/layout.js"></script>
    <script type="module" src="/js/pages/main.js"></script>
  </body>
</html>
