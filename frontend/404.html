<!doctype html>
<!-- 역할: 없는 주소(404) 안내 페이지. 개발 서버는 vite.config.js가, 배포하면 호스팅 서비스가 이 파일을 보여 준다. 담당: 김근영
     어느 주소에서 열려도 깨지지 않게 css/js 경로는 모두 "/"로 시작한다. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9f4" />
    <title>페이지를 찾을 수 없어요 · MealMeter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <main id="main" class="site-main" tabindex="-1">
      <div class="state-box">
        <span class="state-box__icon" aria-hidden="true">🍽️</span>
        <h1>찾는 페이지가 없어요</h1>
        <p>주소가 바뀌었거나 잘못 입력된 것 같아요. 주소를 다시 확인해 주세요.</p>
        <a class="btn btn--primary" href="/">홈으로</a>
      </div>
    </main>

    <script type="module" src="/js/common/layout.js"></script>
  </body>
</html>
