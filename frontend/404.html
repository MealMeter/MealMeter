<!doctype html>
<!-- 역할: 없는 주소(404) 안내 페이지. 개발 서버는 vite.config.js가, 배포하면 호스팅 서비스가 이 파일을 보여 준다. 담당: 김근영
     어느 주소에서 열려도 깨지지 않게 css/js 경로는 모두 "/"로 시작한다. -->
<!-- [문법] <!doctype html>: 이 문서가 최신 HTML(HTML5)이라고 브라우저에 알린다. 반드시 파일 맨 첫 줄에 있어야 한다. -->
<!-- [문법] <!- - ... - ->: HTML 주석. 화면에 보이지 않는다. (이 설명에서는 닫힘 표시와 헷갈리지 않게 띄어 썼다) -->
<!-- [문법] <html lang="ko">: 문서 전체를 감싸는 뿌리 요소. lang="ko"는 한국어 문서라는 뜻(낭독기 발음, 검색에 쓰임). -->
<html lang="ko">
  <!-- [문법] <head>: 화면에 직접 보이지 않는 문서 정보(글자 인코딩, 제목, CSS 연결 등)를 담는 곳. -->
  <head>
    <!-- [문법] <meta charset="UTF-8" />: 한글 등 모든 글자를 UTF-8 방식으로 읽으라는 뜻. 없으면 한글이 깨질 수 있다. -->
    <!-- [문법] 끝의 " />": 내용이 없는 빈 요소(void element)를 닫는 표시. HTML5에서는 생략해도 된다. -->
    <meta charset="UTF-8" />
    <!-- [문법] viewport: 휴대폰에서 화면 폭을 기기 폭에 맞추고(width=device-width), 처음 확대 배율을 1로 둔다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- [문법] theme-color: 휴대폰 브라우저 주소창 등의 색을 이 색(#fff9f4, 연한 크림색)으로 칠한다. -->
    <meta name="theme-color" content="#fff9f4" />
    <!-- [문법] <title>: 브라우저 탭에 보이는 페이지 제목. -->
    <title>페이지를 찾을 수 없어요 · MealMeter</title>
    <!-- [문법] <link rel="preconnect">: 구글 폰트 서버에 미리 연결해 두어 글꼴을 더 빨리 받게 한다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- [문법] <link rel="stylesheet" href="...">: 외부 CSS 파일을 불러온다. 여기서는 제목용 글꼴 Jua. display=swap: 글꼴을 받기 전엔 기본 글꼴로 먼저 보여 준다. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <!-- 본문용 글꼴 Pretendard를 CDN(jsdelivr)에서 버전(v1.3.9)을 고정해 불러온다. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 모든 페이지 공통 스타일. "/"로 시작하는 절대 경로라 /a/b/c 같은 깊은 주소에서도 제대로 불러온다. -->
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <!-- [문법] <body>: 화면에 실제로 보이는 내용. 헤더·푸터는 layout.js가 이 안의 맨 앞·맨 뒤에 넣어 준다. -->
  <body>
    <!-- [문법] <main>: 페이지의 핵심 내용 영역(페이지에 하나). id="main": 건너뛰기 링크(href="#main")가 찾아오는 이름표. -->
    <!-- [문법] tabindex="-1": Tab 키 순서에는 안 들어가지만, 링크로 이동했을 때 포커스는 받을 수 있게 한다. -->
    <main id="main" class="site-main" tabindex="-1">
      <!-- [문법] <div>: 의미 없는 묶음 상자. class="state-box": base.css 4번 구역의 가운데 정렬 안내 상자 모양. -->
      <div class="state-box">
        <!-- [문법] <span>: 글자 일부를 감싸는 인라인 상자. aria-hidden="true": 장식용 그림이라 낭독기가 읽지 않는다. -->
        <span class="state-box__icon" aria-hidden="true">🍽️</span>
        <!-- [문법] <h1>: 페이지의 가장 큰 제목. 한 페이지에 하나만 쓴다. -->
        <h1>찾는 페이지가 없어요</h1>
        <!-- [문법] <p>: 문단. -->
        <p>주소가 바뀌었거나 잘못 입력된 것 같아요. 주소를 다시 확인해 주세요.</p>
        <!-- [문법] <a href="/">: 링크. "/"는 사이트 첫 페이지. class="btn btn--primary": 링크지만 주황색 버튼 모양. -->
        <a class="btn btn--primary" href="/">홈으로</a>
      </div>
    </main>

    <!-- [문법] <script type="module" src="...">: JS 파일을 ES 모듈로 불러온다. 모듈은 HTML을 다 읽은 뒤 실행되고 import/export를 쓸 수 있다. -->
    <!-- layout.js가 실행되면 헤더(메뉴)와 푸터가 자동으로 붙는다. -->
    <script type="module" src="/js/common/layout.js"></script>
  </body>
</html>
