<!doctype html>
<!-- 역할: 메뉴 상세 페이지 (menu.html?menuId=3&meal=2) — 평가 작성 + 평가 목록 (명세서 3장 기능 2). 담당: 박준호
     meal(식사 코드)은 있으면 "중식" 같은 표시와 알레르기 찾기에 쓰고, 없어도 동작한다.
     폼의 뼈대는 여기 있고, 태그 버튼·평가 목록·요약은 js/pages/menu.js가 채운다. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9f4" />
    <title>메뉴 평가 · MealMeter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/menu.css" />
  </head>
  <body>
    <main id="main" class="site-main" tabindex="-1">
      <div class="menu-detail">
        <a class="back-link" href="/"><span aria-hidden="true">←</span> 오늘의 메뉴</a>

        <!-- 불러오는 중 / 오류가 이 자리에 나온다 -->
        <div id="menu-state"></div>

        <!-- 불러오기에 성공하면 hidden을 풀어서 보여 준다 -->
        <div id="menu-content" class="menu-detail__content" hidden>
          <!-- 메뉴 이름과 지금까지의 평가 요약 -->
          <section class="menu-detail__header" aria-labelledby="menu-name">
            <p class="menu-detail__meta" id="menu-meta"></p>
            <h1 id="menu-name"></h1>
            <p class="menu-detail__summary" id="menu-summary"></p>
            <p class="menu-detail__allergy" id="menu-allergy" hidden></p>
          </section>

          <div class="menu-detail__columns">
            <!-- novalidate: 브라우저 기본 경고창 대신 우리가 만든 안내 문구를 쓴다 -->
            <form id="review-form" class="review-form" novalidate aria-labelledby="form-title">
              <h2 id="form-title" class="review-form__title">평가 남기기</h2>

              <!-- 1. 별점 (필수). fieldset + legend: "이 라디오 버튼 5개는 '별점' 한 묶음"이라고 알려 준다.
                   진짜 입력은 숨긴 라디오 버튼이라 Tab으로 들어와서 화살표 키로 고를 수 있다. -->
              <fieldset class="star-input" id="star-input">
                <legend class="review-form__legend">별점 <span class="chip chip--required">필수</span></legend>
                <div class="star-input__stars">
                  <label class="star-input__option"><input type="radio" name="rating" value="1" class="sr-only" /><span class="star-input__star" aria-hidden="true">☆</span><span class="sr-only">1점, 별로예요</span></label>
                  <label class="star-input__option"><input type="radio" name="rating" value="2" class="sr-only" /><span class="star-input__star" aria-hidden="true">☆</span><span class="sr-only">2점, 아쉬워요</span></label>
                  <label class="star-input__option"><input type="radio" name="rating" value="3" class="sr-only" /><span class="star-input__star" aria-hidden="true">☆</span><span class="sr-only">3점, 보통이에요</span></label>
                  <label class="star-input__option"><input type="radio" name="rating" value="4" class="sr-only" /><span class="star-input__star" aria-hidden="true">☆</span><span class="sr-only">4점, 좋아요</span></label>
                  <label class="star-input__option"><input type="radio" name="rating" value="5" class="sr-only" /><span class="star-input__star" aria-hidden="true">☆</span><span class="sr-only">5점, 최고예요</span></label>
                </div>
                <!-- 고른 점수를 글로 보여 준다 (라디오 이름에 이미 들어 있어서 낭독기에는 숨긴다) -->
                <p class="star-input__value" id="rating-value" aria-hidden="true"></p>
              </fieldset>

              <!-- 2. 간·양·온도·식감 태그 (선택). 버튼은 menu.js가 reviewFields.js를 보고 만든다 -->
              <fieldset class="review-form__group">
                <legend class="review-form__legend">맛 태그 <span class="review-form__optional">(선택, 다시 누르면 취소)</span></legend>
                <div class="review-form__tags" id="tag-groups"></div>
              </fieldset>

              <!-- 3. 위생 — 사고 신고 성격이라 다른 태그와 떨어뜨려 눈에 띄게 그린다 -->
              <fieldset class="review-form__hygiene" id="hygiene-group">
                <legend class="review-form__legend review-form__legend--danger"><span class="review-form__alert-icon" aria-hidden="true">!</span>위생 문제 신고</legend>
                <p class="review-form__help">이물질, 덜 익은 음식, 상한 냄새처럼 위생 문제가 있었나요?</p>
                <div class="review-form__hygiene-options" id="hygiene-options"></div>
                <p class="review-form__hygiene-hint" id="hygiene-hint" hidden>어떤 문제였는지 아래 의견란에 적어 주면 개선에 큰 도움이 돼요.</p>
              </fieldset>

              <!-- 4. 자유 의견 (선택) -->
              <div class="review-form__comment">
                <label for="review-comment" class="review-form__legend">자유 의견 <span class="review-form__optional">(선택)</span></label>
                <!-- 명세서: 입력창 위에 안내 문구를 둔다 -->
                <p id="comment-guide" class="review-form__note"><span aria-hidden="true">i</span>메뉴에 대한 의견만 써주세요. 특정인을 향한 글은 삼가주세요</p>
                <!-- maxlength는 menu.js가 reviewFields.js의 값(100자)으로 채운다 -->
                <textarea id="review-comment" class="review-form__textarea" rows="3"
                  placeholder="예: 고기는 부드러웠는데 조금 짰어요."
                  aria-describedby="comment-guide comment-count"></textarea>
                <p id="comment-count" class="review-form__count">0자</p>
              </div>

              <!-- 별점을 안 골랐거나 서버가 거절했을 때(금칙어 등) 여기에 오류가 나온다 -->
              <div id="review-form-error"></div>

              <!-- role="status": 화면 낭독기가 "평가가 등록됐어요"를 알아서 읽어 준다 -->
              <p role="status" id="review-form-success" class="review-form__success"></p>

              <button type="submit" class="btn btn--primary review-form__submit" id="review-submit">평가 등록</button>
            </form>

            <section class="review-section" aria-labelledby="list-title">
              <h2 id="list-title" class="review-section__title">이 메뉴의 평가 <span class="review-section__sort">최신순</span></h2>
              <div id="review-list"></div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/js/common/layout.js"></script>
    <script type="module" src="/js/pages/menu.js"></script>
  </body>
</html>
