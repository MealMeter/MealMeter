<!doctype html>
<!-- 역할: 인기 순위 페이지 (ranking.html) — 명세서 3장 기능 3. 담당: 조현우
     순위 표는 js/pages/ranking.js가 서버 데이터를 받아 채운다. -->
<!-- [문법] <!doctype html>(맨 첫 줄): 이 문서가 HTML5라는 선언. '<!' + 대시 두 개로 시작하고 대시 두 개 + '>'로 끝나는 부분은 화면에 안 보이는 HTML 주석 -->
<!-- [문법] <html lang="ko">: 문서 전체를 감싸는 뿌리 요소. lang="ko"는 한국어 문서(낭독기 발음·검색에 쓰임) -->
<html lang="ko">
  <!-- [문법] <head>: 화면에 직접 보이지 않는 문서 정보(인코딩, 제목, CSS 연결)를 담는 곳 -->
  <head>
    <!-- [문법] <meta charset>: 글자를 UTF-8로 읽으라는 뜻(한글 깨짐 방지). 끝의 /> 는 내용 없는 빈 요소 표시(생략 가능) -->
    <meta charset="UTF-8" />
    <!-- [문법] viewport: 휴대폰에서 화면 폭을 기기 폭에 맞추고 처음 확대 배율을 1로 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- [문법] theme-color: 휴대폰 브라우저 주소창 등의 색 -->
    <meta name="theme-color" content="#fff9f4" />
    <!-- [문법] <title>: 브라우저 탭에 보이는 제목 -->
    <title>인기 순위 · MealMeter</title>
    <!-- [문법] rel="preconnect": 글꼴 서버에 미리 연결해 두어 더 빨리 받는다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- [문법] rel="stylesheet": 외부 CSS를 불러온다. 구글 폰트 Jua(제목용). display=swap: 받기 전엔 기본 글꼴로 먼저 보여 줌 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <!-- [문법] 본문 글꼴 Pretendard를 CDN에서 버전을 고정(@v1.3.9)해 불러온다 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- [문법] "/"로 시작하는 절대 경로: 개발 서버(npm run dev)의 frontend 폴더 기준. 파일을 더블클릭해 열면 못 찾는다 -->
    <link rel="stylesheet" href="/css/base.css" />
    <!-- [문법] 이 페이지 전용 CSS(공통 CSS 뒤에 불러온다) -->
    <link rel="stylesheet" href="/css/ranking.css" />
  </head>
  <!-- [문법] <body>: 화면에 보이는 내용. 헤더·푸터는 layout.js가 넣는다 -->
  <body>
    <!-- [문법] <main>: 핵심 내용 영역. id="main"은 건너뛰기 링크의 도착점, tabindex="-1"은 포커스만 받을 수 있게 -->
    <main id="main" class="site-main" tabindex="-1">
      <div class="ranking-page">
        <!-- [문법] <header>: 머리 영역 의미 태그 -->
        <header class="ranking-page__head">
          <!-- [문법] <p>: 문단. eyebrow 클래스는 제목 위 작은 안내 글 모양(base.css) -->
          <p class="eyebrow">누적 평가 기준</p>
          <!-- [문법] <h1>: 페이지 대제목 -->
          <h1>인기 순위</h1>
          <p class="ranking-page__desc">지금까지 쌓인 평가를 평균 별점이 높은 순서로 보여 줘요. 같은 메뉴는 다른 날 나와도 하나로 합쳐요.</p>
        </header>

        <!-- 불러오는 중 / 오류 / 순위 표가 이 자리에 들어간다 -->
        <!-- [문법] 비어 있는 상자. ranking.js가 id로 찾아 불러오는 중/오류/순위 표를 채운다 -->
        <div id="ranking-content"></div>
      </div>
    </main>

    <!-- [문법] type="module": ES 모듈로 불러온다. HTML을 다 읽은 뒤 순서대로 실행 -->
    <script type="module" src="/js/common/layout.js"></script>
    <script type="module" src="/js/pages/ranking.js"></script>
  </body>
</html>
